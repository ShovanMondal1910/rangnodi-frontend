<div class="app-shell">
  <!-- Top Bar: Shows Admin Top Navbar for Admin workflows, or Storefront Navbar for Customers -->
  @if (isAdminRoute()) {
    <app-admin-navbar></app-admin-navbar>
  } @else {
    <app-navbar></app-navbar>
  }

  <!-- Main View -->
  <main class="app-content" [class.admin-layout-main]="isAdminRoute()">
    <router-outlet />
  </main>

  <!-- Store Footer: Only visible on Customer Storefront pages, hidden on Admin routes -->
  @if (!isAdminRoute()) {
    <app-footer></app-footer>
  }

  <!-- Global Toasts -->
  <div class="toast-container">
    @for (t of toastService.toasts(); track t.id) {
      <div class="toast-item" [class]="'toast-' + t.type">
        <span class="toast-msg">{{ t.message }}</span>
        <button type="button" class="toast-close" (click)="toastService.remove(t.id)">&times;</button>
      </div>
    }
  </div>
</div>
